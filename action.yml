name: Nuon Release (retired)
description: This action is retired because Nuon releases are no longer supported.
branding:
  icon: truck
  color: purple
runs:
  using: composite
  steps:
    - name: Nuon Release action retired
      shell: bash
      run: |
        echo "::error::nuonco/actions-release is retired because the Nuon release API was removed. Use app branches for multi-install rollouts or 'nuon installs components deploy' for one install."
        exit 1
